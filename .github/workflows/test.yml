name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26, latest]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 22.8 to install dependencies
        uses: actions/setup-node@v3
        with:
          node-version: 22.8.0
      - name: Install dependencies
        run: npm ci
      - name: Use Node.js ${{ matrix.node-version }} to run tests
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test
        env:
          CI: true
